<!doctype html>
<html lang="{{ site.Language.Locale }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
  <meta name="description" content="{{ site.Params.description }}">
  {{ with resources.Get "images/logo.png" }}
  <link rel="icon" type="image/png" href="{{ (.Fit "64x64 png").RelPermalink }}">
  <link rel="apple-touch-icon" href="{{ (.Fit "180x180 png").RelPermalink }}">
  {{ end }}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Poppins:wght@300;400;500&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
  {{ with resources.Get "css/main.css" | minify | fingerprint }}
  <link rel="stylesheet" href="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}">
  {{ end }}
</head>
<body class="theme-{{ site.Params.theme | default "marigold" }}{{ with .Section }} section-{{ . }}{{ end }}">
  {{ partial "menu.html" . }}
  <main>
    {{ block "main" . }}{{ end }}
  </main>
</body>
</html>
